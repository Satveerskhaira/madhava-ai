[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rulegraph"
version = "0.2.0"
description = "SDK-agnostic kernel for planner and domain agents that explain decisions over a rules/policy graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "cel-python>=0.5",
  "httpx>=0.27",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
adk = ["google-adk[a2a]>=2.12", "a2a-sdk>=1.2"]
mcp = ["mcp>=2.3"]
rdf = ["rdflib>=7", "pyshacl>=0.26"]
mongo = ["pymongo>=4.6"]
dev = ["pytest>=8", "uvicorn>=0.30", "rdflib>=7", "pyshacl>=0.26", "mongomock>=4.1"]

[project.scripts]
rulegraph = "rulegraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rulegraph = ["templates/**/*", "templates/**/.*", "templates/**/.*/**/*", "viewer.html", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
