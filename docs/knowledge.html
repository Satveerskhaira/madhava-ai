<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharmacy claims knowledge</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#17202b; --muted:#5b6675; --line:#dfe3e8; --soft:#eef1f4; --accent:#0f766e;
  --k-concept:#0f766e; --k-term:#7c3aed; --k-rule:#b45309; --k-field:#2563eb; --k-outcome:#be123c;
  --k-policy:#4b5563; --k-ruleset:#a21caf; --code:#f1f3f5; --focus:#f59e0b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a; --panel:#161d25; --ink:#e6ebf0; --muted:#9aa7b4; --line:#2a3440; --soft:#1d2630; --accent:#2dd4bf;
    --k-concept:#2dd4bf; --k-term:#a78bfa; --k-rule:#f59e0b; --k-field:#60a5fa; --k-outcome:#fb7185;
    --k-policy:#9ca3af; --k-ruleset:#e879f9; --code:#0d1319; --focus:#fbbf24; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#161d25; --ink:#e6ebf0; --muted:#9aa7b4; --line:#2a3440; --soft:#1d2630; --accent:#2dd4bf;
  --k-concept:#2dd4bf; --k-term:#a78bfa; --k-rule:#f59e0b; --k-field:#60a5fa; --k-outcome:#fb7185;
  --k-policy:#9ca3af; --k-ruleset:#e879f9; --code:#0d1319; --focus:#fbbf24; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em}
pre{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;white-space:pre-wrap;margin:6px 0}
.top{position:sticky;top:0;z-index:5}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header .sub{overflow-wrap:anywhere}
header h1{font-size:17px;margin:0;font-weight:650}
header .sub{color:var(--muted);font-size:13px}
.search{position:relative;margin-left:auto;flex:1 1 260px;max-width:440px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.results{position:absolute;left:0;right:0;top:40px;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:60vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none}
.results div{padding:7px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.results div:hover,.results div.on{background:var(--soft)}
nav{display:flex;gap:2px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav a{padding:10px 12px;text-decoration:none;color:var(--muted);font-weight:550;border-bottom:2px solid transparent;white-space:nowrap}
nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media(min-width:1100px){.wrap.split{grid-template-columns:minmax(0,1fr) 420px}}
main{padding:20px;min-width:0}
aside{background:var(--panel);border-left:1px solid var(--line);padding:18px 20px;min-width:0;display:none}
.wrap.split aside{display:block;position:sticky;top:var(--top,100px);max-height:calc(100vh - var(--top,100px));overflow:auto}
@media(max-width:1099px){.wrap.split aside{position:fixed;inset:auto 0 0 0;max-height:70vh;border-top:1px solid var(--line);border-left:0;box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:6}}
aside .close{float:right;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:2px 9px;cursor:pointer}
h2{font-size:20px;margin:0 0 4px} h3{font-size:15px;margin:18px 0 6px} .lead{color:var(--muted);margin:0 0 16px;max-width:75ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0 22px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none}
.tile b{display:block;font-size:24px;font-variant-numeric:tabular-nums} .tile span{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:12px} @media(min-width:900px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
table{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-weight:600;font-size:13px;position:sticky;top:0}
.tablewrap{overflow-x:auto;border-radius:10px}
.ref{text-decoration:none;border-bottom:1px dotted currentColor;cursor:pointer;font-weight:550}
.k-concept{color:var(--k-concept)} .k-term{color:var(--k-term)} .k-rule{color:var(--k-rule)} .k-field{color:var(--k-field)}
.k-outcome{color:var(--k-outcome)} .k-policy{color:var(--k-policy)} .k-ruleset{color:var(--k-ruleset)}
.badge{display:inline-block;font-size:11px;font-weight:650;letter-spacing:.02em;padding:1px 7px;border-radius:99px;border:1px solid currentColor;text-transform:uppercase;white-space:nowrap}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--soft);margin:2px 4px 2px 0}
.muted{color:var(--muted)} .row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;margin:8px 0} dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.filter{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px} .filter input[type=text]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;min-width:220px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip:not(.on){opacity:.6}
.gtools{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.tree{list-style:none;padding-left:18px;margin:4px 0;border-left:1px solid var(--line)}
.tree li{margin:6px 0}
.versions{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.quote{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--ink);margin:6px 0}
.sample{color:var(--muted);font-size:12px}
#graphbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:min(72vh,780px);position:relative;overflow:hidden;touch-action:none}
#graphbox svg{width:100%;height:100%;display:block;cursor:grab}
#graphbox svg.dragging{cursor:grabbing}
.gl{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);background:var(--panel);padding:2px 6px;border-radius:6px}
svg text{font:11px system-ui,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px;pointer-events:none}
svg .edge{stroke:var(--line);stroke-width:1}
svg text.glabel{font-size:20px;font-weight:700;fill:var(--muted);stroke-width:5px;opacity:.85}
svg .edge.hi{stroke:var(--accent);stroke-width:2}
svg .node{cursor:pointer;stroke:var(--panel);stroke-width:1.5}
svg .node.dim,svg .edge.dim,svg text.dim{opacity:.12}
svg .node.sel{stroke:var(--focus);stroke-width:3}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;margin:8px 0}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
footer{color:var(--muted);font-size:12px;padding:10px 20px 30px}
.theme{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
</style>
</head>

 3.4 Benefit exclusions"],"rulesets":["RS-FRM-2026.01.1"]}],"overrides":[]},{"id":"R-FRM-002","domain":"formulary","concept":"coverage.formulary_status","agent":"coverage","versions":[{"version":1,"status":"approved","intent":"Reject drugs that are not on the plan formulary","condition":"!has(plan.formulary.drug.onFormulary) || !plan.formulary.drug.onFormulary","recordInputs":["claim.drug.name"],"referenceInputs":["plan.formulary.drug.onFormulary"],"outcome":{"type":"reject","code":"MR"},"token":"reject:MR","overriddenBy":[],"template":"{{claim.drug.name}} is not on this plan's formulary.","order":20,"confidence":"high","owner":"formulary-sme-team","sources":["Plan Setup Guide v7 / 3.1 Formulary status"],"rulesets":["RS-FRM-2026.01.1"]}],"overrides":[]},{"id":"R-FRM-INFO-001","domain":"formulary","concept":"coverage.tier","agent":"coverage","versions":[{"version":1,"status":"approved","intent":"State the drug's formulary tier, which drives cost share and tier-based edits","condition":"has(plan.formulary.drug.tier)","recordInputs":["claim.drug.name"],"referenceInputs":["plan.formulary.drug.tier"],"outcome":{"type":"info"},"token":null,"overriddenBy":[],"template":"{{claim.drug.name}} is on tier {{plan.formulary.drug.tier}} of this plan's formulary.","order":90,"confidence":"high","owner":"formulary-sme-team","sources":["Plan Setup Guide v7 / 3.2 Tier placement"],"rulesets":["RS-FRM-2026.01.1"]}],"overrides":[]},{"id":"R-NET-001","domain":"network","concept":"network.specialty_channel","agent":"network","versions":[{"version":1,"status":"approved","intent":"Reject a specialty drug filled at retail for more than the retail specialty days supply limit","condition":"has(plan.formulary.drug.specialty) && plan.formulary.drug.specialty && claim.pharmacy.channel == 'retail' && claim.daysSupply > plan.network.specialty.retailMaxDaysSupply","recordInputs":["claim.drug.name","claim.pharmacy.channel","claim.daysSupply"],"referenceInputs":["plan.formulary.drug.specialty","plan.network.specialty.retailMaxDaysSupply"],"outcome":{"type":"reject","code":"76"},"token":"reject:76","overriddenBy":[],"template":"{{claim.drug.name}} is a specialty drug. At retail it is limited to {{plan.network.specialty.retailMaxDaysSupply}} days, and this fill was {{claim.daysSupply}} days.","order":50,"confidence":"high","owner":"network-sme-team","sources":["Network Management Guide v4 / 5.2 Specialty at retail"],"rulesets":["RS-NET-2026.01.1"]}],"overrides":[]},{"id":"R-PA-001","domain":"prior_authorization","concept":"um.prior_authorization","agent":"utilization_management","versions":[{"version":1,"status":"approved","intent":"Reject when the drug is flagged as needing prior authorization and none is on file","condition":"has(plan.formulary.drug.paRequired) && plan.formulary.drug.paRequired && !claim.priorAuth.onFile","recordInputs":["claim.drug.name","claim.priorAuth.onFile"],"referenceInputs":["plan.formulary.drug.paRequired"],"outcome":{"type":"reject","code":"75"},"token":"reject:75","overriddenBy":["R-PA-OVR-002"],"template":"{{claim.drug.name}} needs prior authorization on this plan, and no approved authorization was on file for this fill.","order":20,"confidence":"high","owner":"um-sme-team","sources":["Plan Setup Guide v7 / 4.2 Prior Auth","Reject Code Table"],"rulesets":["RS-PA-2026.01.1"]},{"version":2,"status":"approved","intent":"Reject when the drug is flagged for prior authorization, or sits on a plan PA tier, and none is on file","condition":"((has(plan.formulary.drug.paRequired) && plan.formulary.drug.paRequired)\n || (has(plan.formulary.drug.tier) && plan.formulary.drug.tier in plan.um.priorAuth.requiredTiers))\n&& !claim.priorAuth.onFile","recordInputs":["claim.drug.name","claim.priorAuth.onFile"],"referenceInputs":["plan.formulary.drug.paRequired","plan.formulary.drug.tier","plan.um.priorAuth.requiredTiers"],"outcome":{"type":"reject","code":"75"},"token":"reject:75","overriddenBy":["R-PA-OVR-002"],"template":"{{claim.drug.name}} needs prior authorization on this plan: it is flagged for prior authorization or sits on a PA tier (drug tier {{plan.formulary.drug.tier}}, PA tiers {{plan.um.priorAuth.requiredTiers|list}}), and no approved authorization was on file.","order":20,"confidence":"high","owner":"um-sme-team","sources":["Plan Setup Guide v8 / 4.2 Prior Auth","ENG-REL-4412 release notes"],"rulesets":["RS-PA-2026.10.1"]}],"overrides":[]},{"id":"R-PA-OVR-002","domain":"prior_authorization","concept":"um.prior_authorization","agent":"utilization_management","versions":[{"version":1,"status":"approved","intent":"Waive prior authorization during a new member's transition window","condition":"claim.member.daysSinceEnrollment <= plan.um.priorAuth.transitionFillDays","recordInputs":["claim.member.daysSinceEnrollment"],"referenceInputs":["plan.um.priorAuth.transitionFillDays"],"outcome":{"type":"override"},"token":null,"overriddenBy":[],"template":"The member enrolled {{claim.member.daysSinceEnrollment}} days ago, inside the {{plan.um.priorAuth.transitionFillDays}}-day transition window, so prior authorization is waived.","order":10,"confidence":"high","owner":"um-sme-team","sources":["Plan Setup Guide v7 / 4.5 Transition fills"],"rulesets":["RS-PA-2026.01.1","RS-PA-2026.10.1"]}],"overrides":["R-PA-001"]},{"id":"R-QL-001","domain":"quantity_limits","concept":"um.quantity_limits","agent":"utilization_management","versions":[{"version":1,"status":"approved","intent":"Reject when the quantity dispensed exceeds the drug's per-fill quantity limit","condition":"has(plan.formulary.drug.qlQuantity) && double(claim.quantity) > double(plan.formulary.drug.qlQuantity)","recordInputs":["claim.drug.name","claim.quantity"],"referenceInputs":["plan.formulary.drug.qlQuantity"],"outcome":{"type":"reject","code":"76"},"token":"reject:76","overriddenBy":[],"template":"The quantity {{claim.quantity}} is over the plan limit of {{plan.formulary.drug.qlQuantity}} per fill for {{claim.drug.name}}.","order":40,"confidence":"high","o main":"step_therapy","concept":"um.step_therapy","agent":"utilization_management","versions":[{"version":1,"status":"approved","intent":"Reject when no required first-line drug was filled in the lookback window","condition":"has(plan.formulary.drug.stepPrereqs) && size(plan.formulary.drug.stepPrereqs) > 0 && !plan.formulary.drug.stepPrereqs.exists(d, d in claim.history.stepDrugsFilled)","recordInputs":["claim.drug.name","claim.history.stepDrugsFilled"],"referenceInputs":["plan.formulary.drug.stepPrereqs"],"outcome":{"type":"reject","code":"608"},"token":"reject:608","overriddenBy":[],"template":"{{claim.drug.name}} requires trying {{plan.formulary.drug.stepPrereqs|list}} first, and none was filled in the lookback window.","order":30,"confidence":"high","owner":"um-sme-team","sources":["Plan Setup Guide v7 / 4.3 Step therapy"],"rulesets":["RS-ST-2026.01.1"]}],"overrides":[]}],"rulesets":[{"id":"RS-DUR-2026.01.1","domain":"dur","owner":"clinical-sme-team","from":"2026-01-01","to":null,"status":"active","reason":"Baseline drug interaction rule","previous":null,"rules":["R-DUR-001@1"]},{"id":"RS-RTS-2026.01.1","domain":"refill_too_soon","owner":"clinical-sme-team","from":"2026-01-01","to":null,"status":"active","reason":"Baseline refill too soon rule","previous":null,"rules":["R-RTS-001@1"]},{"id":"RS-COB-2026.01.1","domain":"cob","owner":"cob-sme-team","from":"2026-01-01","to":null,"status":"active","reason":"Baseline coordination of benefits rule","previous":null,"rules":["R-COB-001@1"]},{"id":"RS-ACC-2026.01.1","domain":"accumulators","owner":"benefits-sme-team","from":"2026-01-01","to":null,"status":"active","reason":"Baseline deductible rule","previous":null,"rules":["R-ACC-001@1"]},{"id":"RS-COPAY-2026.01.1","domain":"benefit_copay","owner":"benefits-sme-team","from":"2026-01-01","to":null,"status":"active","reason":"Baseline copay and coinsurance rules","previous":null,"rules":["R-CS-001@1","R-CS-002@1"]},{"id":"RS-FRM-2026.01.1","domain":"formulary","owner":"for y cost share","doc":"Benefit Summary 2026","section":"Pharmacy cost share","title":"Pharmacy cost share by tier and channel","text":"The member pays a flat copay or a coinsurance percentage set by the drug's tier and the dispensing channel. Coinsurance is capped at the plan's per-fill maximum.","owner":"benefits-sme-team","version":"2026","effective":"2026-01-01","sample":true,"rules":["R-CS-001","R-CS-002"]},{"key":"COB Processing Guide v2 / 1.2 Primary payer first","doc":"COB Processing Guide v2","section":"1.2 Primary payer first","title":"Bill the primary payer first","text":"When other primary coverage is on file and the plan is secondary, a claim submitted without billing the primary payer (other coverage code 0 or 1) rejects with 41.","owner":"cob-sme-team","version":"2","effective":"2026-01-01","sample":true,"rules":["R-COB-001"]},{"key":"Clinical Edits Guide v2 / 1.1 Refill too soon","doc":"Clinical Edits Guide v2","section":"1.1 Refill too soon","title":"Refill too soon","text":"A refill rejects with 79 when the days since the last fill are less than the plan's threshold percentage of the previous days supply.","owner":"clinical-sme-team","version":"2","effective":"2026-01-01","sample":true,"rules":["R-RTS-001"]},{"key":"Clinical Edits Guide v2 / 2.3 Drug-drug interactions","doc":"Clinical Edits Guide v2","section":"2.3 Drug-drug interactions","title":"Severe drug-drug interactions","text":"When the plan rejects severe interactions, a claim for a drug with a severe interaction with an active medication in the member's history rejects with 88.","owner":"clinical-sme-team","version":"2","effective":"2026-01-01","sample":true,"rules":["R-DUR-001"]},{"key":"ENG-REL-4412 release notes","doc":"ENG-REL-4412 release notes","section":null,"title":"Release ENG-REL-4412: prior authorization by tier","text":"Adds prior authorization by formulary tier. Plans list their prior authorization tiers in plan setup; drugs on those tiers need an authorization even when not flagged individually. Effective 2026-10-01.","owner":"um-sme-team","version":"4412","effective":"2026-10-01","sample":true,"rules":["R-PA-001"]},{"key":"Eligibility Processing Guide v3 / 2.1 Terminated members","doc":"Eligibility Processing Guide v3","section":"2.1 Terminated members","title":"Claims after coverage termination","text":"A claim whose date of service is after the member's coverage end date, where the coverage ended by termination, rejects as member not eligible. Grace periods are configured separately and are not applied by this check.","owner":"eligibility-sme-team","version":"3","effective":"2026-01-01","sample":true,"rules":["R-ELIG-001"]},{"key":"Eligibility Processing Guide v3 / 2.2 Future effective members","doc":"Eligibility Processing Guide v3","section":"2.2 Future effective members","title":"Claims before coverage starts","text":"A claim whose date of service is before the member's coverage start date rejects as not yet eligible, even if the member is already loaded in the eligibility file.","owner":"eligibility-sme-team","version":"3","effective":"2026-01-01","sample":true,"rules":["R-ELIG-002"]},{"key":"Network Management Guide v4 / 5.2 Specialty at retail","doc":"Network Management Guide v4","section":"5.2 Specialty at retail","title":"Specialty drugs at retail","text":"Specialty drugs filled at a retail pharmacy are limited to the plan's retail specialty days supply. Longer fills must go through the specialty pharmacy and reject at retail with 76.","owner":"network-sme-team","version":"4","effective":"2026-01-01","sample":true,"rules":["R-NET-001"]},{"key":"Plan Setup Guide v7 / 3.1 Formulary status","doc":"Plan Setup Guide v7","section":"3.1 Formulary status","title":"Drugs not on the formulary","text":"A drug that is not on the plan formulary, or has no formulary entry for the plan version in force, is not covered and the claim rejects. A formulary exception, when approved, is loaded as a formulary entry.","owner":"coverage-sme-team","version":"7","effective":"2026-01-01","sample":true,"rules":["R-FRM-002"]},{"key":"Plan Setup Guide v7 / 3.2 Tier placement","doc":"Plan Setup Guide v7","section":"3.2 Tier placement","title":"Formulary tier placement","text":"Every formulary drug sits on one tier. The tier drives member cost share and tier-based edits such as prior authorization by tier, so explanations always state it.","owner":"coverage-sme-team","version":"7","effective":"2026-01-01","sample":true,"rules":["R-FRM-INFO-001"]},{"key":"Plan Setup Guide v7 / 3.4 Benefit exclusions","doc":"Plan Setup Guide v7","section":"3.4 Benefit exclusions","title":"Benefit exclusions","text":"Drugs the plan excludes from the pharmacy benefit reject even when they appear on the formulary list. Exclusions are set per drug in plan setup.","owner":"coverage-sme-team","version":"7","effective":"2026-01-01","sample":true,"rules":["R-FRM-001"]},{"key":"Plan Setup Guide v7 / 4.2 Prior Auth","doc":"Plan Setup Guide v7","section":"4.2 Prior Auth","title":"Prior authorization (until 2026-10-01)","text":"Drugs flagged individually as requiring prior authorization reject with 75 unless an approved authorization is on file for the member and drug.","owner":"um-sme-team","version":"7","effective":"2026-01-01","sample":true,"rules":["R-PA-001"]},{"key":"Plan Setup Guide v7 / 4.3 Step therapy","doc":"Plan Setup Guide v7","section":"4.3 Step therapy","title":"Step therapy","text":"A second-line drug rejects when none of its required first-line drugs was filled within the lookback window recorded in claims history.","owner":"um-sme-team","version":"7","effective":"2026-01-01","sample":true,"rules":["R-ST-001"]},{"key":"Plan Setup Guide v7 / 4.4 Days supply limits","doc":"Plan Setup Guide v7","section":"4.4 Days supply limits","title":"Days supply limits","text":"A fill whose days supply is above the plan maximum for the dispensing channel rejects with 76.","owner":"um-sme-team","version":"7","effective":"2026-01-01","sample":true,"rules":["R-QL-002"]},{"key":"Plan Setup Guide v7 / 4.4 Quantity limits","doc":"Plan Setup Guide v7","section":"4.4 Quantity limits","title":"Quantity limits","text":"A fill whose quantity is above the drug's per-fill quantity limit rejects with 76 (plan limitations exceeded).","owner":"um-sme-team","version":"7","effective":"2026-01-01","sample":true,"rules":["R-QL-001"]},{"key":"Plan Setup Guide v7 / 4.5 Transition fills","doc":"Plan Setup Guide v7","section":"4.5 Transition fills","title":"Transition fills","text":"New members within the plan's transition window receive a transition fill: prior authorization is waived so therapy continues while an authorization is requested.","owner":"um-sme-team","version":"7","effective":"2026-01-01","sample":true,"rules":["R-PA-OVR-002"]},{"key":"Plan Setup Guide v8 / 4.2 Prior Auth","doc":"Plan Setup Guide v8","section":"4.2 Prior Auth","title":"Prior authorization (from 2026-10-01)","text":"Prior authorization applies to drugs flagged individually and to every drug on a tier the plan lists as a prior authorization tier. Without an approved authorization on file, the claim rejects with 75.","owner":"um-sme-team","version":"8","effective":"2026-10-01","sample":true,"rules":["R-PA-001"]},{"key":"Reject Code Table","doc":"Reject Code Table","section":null,"title":"NCPDP reject codes used in pharmacy adjudication","text":"Reject codes returned on rejected claims follow the NCPDP Telecommunication standard. Each code names one reason category (for example 75 Prior Authorization Required, 76 Plan Limitations Exceeded, 79 Refill Too Soon). The engine may return several codes on one claim; the first blocking reason in adjudication order is the primary reason.","owner":"pharmacy-ops","version":null,"effective":null,"sample":true,"rules":["R-PA-001"]}],"outcomes":[{"token":"price:coinsurance","meaning":null,"concept":"cost_share.coinsurance","rules":["R-CS-002"]},{"token":"price:copay","meaning":null,"concept":"cost_share.copay","rules":[ <script>
(async function(){

async function loadLive(){

  try {
    const rel = await (await fetch("api/releases")).json();
    const release = new URLSearchParams(location.search).get("release") || rel.default;
    const res = await fetch("api/releases/" + encodeURIComponent(release) + "/view");
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
    const data = await res.json();
    data.meta.releases = rel.releases;
    return data;
  } catch (e) {
    main.innerHTML = '<h2>Could not load the knowledge</h2><p class="lead"></p>';
    main.querySelector("p").textContent = String(e && e.message || e);
    return null;
  }
}
if (LIVE) { D = await loadLive(); if (!D) return; }
const $ = s => document.querySelector(s);

}
const refs = (kind, ids, labeler) => (ids && ids.length) ? ids.map(i => ref(kind, i, labeler ? labeler(i) : undefined)).join(", ") : '<span class="muted">none</span>';

pages.graph = () => `<h2>Knowledge graph</h2><p class="lead">Every concept, term, rule, field, outcome, policy and rule set, with typed edges. Drag to pan, scroll or pinch to zoom, click a node to see its neighbours.</p>

let layoutCache = null;
function layout(){
  if (layoutCache) return layoutCache;
  const N = D.graph.nodes, idx = Object.fromEntries(N.map((n, i) => [n.id, i]));
  const E = D.graph.edges.map(e => [idx[e[0]], idx[e[2]]]).filter(e => e[0] != null && e[1] != null);
  // one sector per domain agent (decision order clockwise from the top), shared knowledge in the middle
  const groups = D.graph.groups.map(g => g.id), R0 = 520, anchor = {shared: [0, 0]};
  groups.forEach((g, i) => { const a = -Math.PI / 2 + 2 * Math.PI * i / groups.length; anchor[g] = [R0 * Math.cos(a), R0 * Math.sin(a)]; });
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;       // deterministic
  const n = N.length, xs = new Float64Array(n), ys = new Float64Array(n);
  N.forEach((nd, i) => { const [ax, ay] = anchor[nd.group] || [0, 0]; xs[i] = ax + (rnd() - .5) * 160; ys[i] = ay + (rnd() - .5) * 160; });

    for (const [a, b] of E) { const ex = xs[a] - xs[b], ey = ys[a] - ys[b], d = Math.sqrt(ex * ex + ey * ey) + .01;

    N.forEach((nd, i) => { const show = visible(i); nodeEls[i].style.display = show ? "" : "none";
      nodeEls[i].classList.toggle("dim", sel >= 0 && !nb.has(i)); nodeEls[i].classList.toggle("sel", i === sel);
      const lab = show && (sel >= 0 ? nb.has(i) : (scale < .55 || (nd.kind === "concept" && C[nd.id.slice(8)] && C[nd.id.slice(8)].isTop)));
      labelEls[i].style.display = lab ? "" : "none"; labelEls[i].classList.toggle("dim", sel >= 0 && !nb.has(i)); });
    D.graph.edges.forEach((e, j) => { const a = idx[e[0]], b = idx[e[2]], show = onR.has(e[1]) && visible(a) && visible(b);
      edgeEls[j].style.display = show ? "" : "none"; const hi = sel >= 0 && (a === sel || b === sel);
      edgeEls[j].classList.toggle("hi", hi); edgeEls[j].classList.toggle("dim", sel >= 0 && !hi); });
    $("#gstat").textContent = sel >= 0 ? `${N[sel].label}: ${nb.size - 1} neighbours. Click empty space to clear.` : `${N.filter((_, i) => visible(i)).length} nodes shown`;
  }
  window.__graphSelect = id => { if (idx[id] != null) { const i = idx[id]; vb = [xs[i] - w / 4, ys[i] - h / 4, w / 2, h / 2]; setVB(); select(i); } };
  function select(i){ sel = i; paint(); }
  svg.addEventListener("click", () => { sel = -1; paint(); });
  $("#kinds").onclick = e => { const b = e.target.closest("[data-k]"); if (!b) return; const k = b.dataset.k; onK.has(k) ? onK.delete(k) : onK.add(k); b.classList.toggle("on"); paint(); };
  $("#rels").onclick = e => { const b = e.target.closest("[data-r]"); if (!b) return; const r = b.dataset.r; onR.has(r) ? onR.delete(r) : onR.add(r); b.classList.toggle("on"); paint(); };
  let drag = null;
  svg.addEventListener("pointerdown", e => { drag = {x: e.clientX, y: e.clientY, vb: [...vb], moved: false}; svg.classList.add("dragging"); });
  window.addEventListener("pointermove", e => { if (!drag) return; const s = vb[2] / svg.clientWidth; const dx = (e.clientX - drag.x) * s, dy = (e.clientY - drag.y) * s;
    if (Math.abs(dx) + Math.abs(dy) > 2) drag.moved = true; vb = [drag.vb[0] - dx, drag.vb[1] - dy, vb[2], vb[3]]; setVB(); });
  window.addEventListener("pointerup", () => { if (drag && drag.moved) { svg.addEventListener("click", stop, {capture: true, once: true}); } drag = null; svg.classList.remove("dragging"); });
  const stop = e => e.stopPropagation();
  svg.addEventListener("wheel", e => { e.preventDefault(); const f = e.deltaY > 0 ? 1.15 : 1 / 1.15, r = svg.getBoundingClientRect();
    const px = vb[0] + (e.clientX - r.left) / r.width * vb[2], py = vb[1] + (e.clientY - r.top) / r.height * vb[3];
    vb = [px - (px - vb[0]) * f, py - (py - vb[1]) * f, vb[2] * f, vb[3] * f]; setVB(); paint(); }, {passive: false});
  paint();
};
function refFor(nodeId){ const [k, ...rest] = nodeId.split(":"); const id = rest.join(":");
  if (k === "rule") return "rule:" + id; if (k === "field") return "field:" + id; if (k === "concept") return "concept:" + id;
  if (k === "term") return "term:" + id; if (k === "outcome") return "outcome:" + id; if (k === "policy") return "policy:" + id;
  if (k === "ruleset") return "ruleset:" + id; return nodeId; }

// ------------------------------------------------------------ detail panel
const detail = {};
const graphLink = nodeId => `<p><a href="#/graph" data-graph="${esc(nodeId)}" class="ref">Show in graph</a></p>`;
detail.concept = c => `${badge("concept")}<h2>${esc(c.label)}</h2><p class="mono muted">${esc(c.id)}</p><p>${esc(c.definition)}</p>
  <dl class="kv"><dt>Agent</dt><dd class="mono">${esc(c.agent || "")}</dd><dt>Decision order</dt><dd>${esc(c.precedence)}</dd>
  ${c.ruleDomain ? `<dt>Rule domain</dt><dd class="mono">${esc(c.ruleDomain)}</dd>` : ""}
  <dt>Broader</dt><dd>${c.broader ? ref("concept", c.broader, cLabel(c.broader)) : '<span class="muted">top concept</span>'}</dd>
  <dt>Narrower</dt><dd>${refs("concept", c.narrower, cLabel)}</dd><dt>Related</dt><dd>${refs("concept", c.related, cLabel)}</dd>
  <dt>Synonyms</dt><dd>${c.alt.map(a => `<span class="pill">${esc(a)}</span>`).join("") || '<span class="muted">none</span>'}</dd>
  <dt>Classifies</dt><dd>${refs("outcome", c.notations)}</dd><dt>Rules</dt><dd>${refs("rule", c.rules)}</dd>
  <dt>Glossary</dt><dd>${refs("term", D.terms.filter(t => t.concepts.includes(c.id)).map(t => t.id), id => T[id].label)}</dd>
  <dt>Fields</dt><dd>${refs("field", D.fields.filter(f => f.concept === c.id).map(f => f.path))}</dd></dl>${graphLink("concept:" + c.id)}`;
detail.term = t => `${badge("term")}<h2>${esc(t.label)}</h2>${t.alt.map(a => `<span class="pill">${esc(a)}</span>`).join("")}<p>${esc(t.definition)}</p>
  ${t.example ? `<p class="muted">Example: ${esc(t.example)}</p>` : ""}
  <dl class="kv"><dt>Taxonomy</dt><dd>${refs("concept", t.concepts, cLabel)}</dd>${t.notation ? `<dt>Notation</dt><dd>${ref("outcome", t.notation)}</dd>` : ""}${t.source ? `<dt>Source</dt><dd>${esc(t.source)}</dd>` : ""}</dl>
  ${t.kind === "term" ? graphLink("term:" + t.id) : ""}`;
detail.rule = (r, vsel) => { const v = r.versions.find(x => x.version === vsel) || latest(r);
  return `${badge("rule")}<h2>${esc(r.id)}</h2><p>${esc(v.intent)}</p>
  <div class="versions">${r.versions.map(x => `<button class="chip ${x.version === v.version ? "on" : ""}" data-ver="${r.id}|${x.version}">v${x.version} · ${esc(x.status)}</button>`).join("")}</div>
  <dl class="kv"><dt>Concept</dt><dd>${ref("concept", r.concept, cLabel(r.concept))}</dd><dt>Rule domain</dt><dd class="mono">${esc(r.domain)}</dd>
  <dt>Explains</dt><dd>${v.token ? ref("outcome", v.token) : esc(v.outcome.type)}</dd><dt>Order</dt><dd>${esc(v.order)}</dd>
  <dt>Rule sets</dt><dd>${refs("ruleset", v.rulesets)}</dd><dt>Overridden by</dt><dd>${refs("rule", v.overriddenBy)}</dd>
  <dt>Overrides</dt><dd>${refs("rule", r.overrides)}</dd><dt>Owner</dt><dd>${esc(v.owner || "")}</dd><dt>Confidence</dt><dd>${esc(v.confidence)}</dd></dl>
  <h3>Condition (CEL)</h3><pre>${esc(v.condition)}</pre>
  ${v.outcome.amount ? `<h3>Amount (CEL)</h3><pre>${esc(v.outcome.amount)}</pre>` : ""}
  <h3>Reads</h3><div>${refs("field", [...v.recordInputs, ...v.referenceInputs])}</div>
  ${v.template ? `<h3>Answer wording</h3><div class="quote">${esc(v.template)}</div>` : ""}
  <h3>Sources</h3>${v.sources.map(s => `<div>${ref("policy", s, (P[s] && P[s].title) || s)}${P[s] && P[s].text ? `<div class="quote">${esc(P[s].text)}</div>` : ""}</div>`).join("") || '<span class="muted">none</span>'}
  ${graphLink("rule:" + r.id)}`; };
detail.field = f => `${badge("field")}<h2 class="mono" style="font-size:17px">${esc(f.path)}</h2><p>${esc(f.description)}</p>
  <dl class="kv"><dt>Source</dt><dd>${esc(f.source)}</dd><dt>Type</dt><dd>${esc(f.type)}</dd><dt>Entity</dt><dd>${ref("class", f.entity)}</dd>
  <dt>Concept</dt><dd>${ref("concept", f.concept, cLabel(f.concept))}</dd>${f.pointer ? `<dt>JSON Pointer</dt><dd><code>${esc(f.pointer)}</code></dd>` : ""}
  ${Object.keys(f.params || {}).length ? `<dt>Depends on</dt><dd>${Object.entries(f.params).map(([k, v]) => `{${esc(k)}} ← ${ref("field", v)}`).join("<br>")}</dd>` : ""}
  <dt>Needed by</dt><dd>${refs("field", D.fields.filter(x => Object.values(x.params || {}).includes(f.path)).map(x => x.path))}</dd>
  <dt>Read by</dt><dd>${refs("rule", f.readBy)}</dd>${f.ncpdp ? `<dt>NCPDP</dt><dd class="mono">${esc(f.ncpdp)}</dd>` : ""}</dl>${graphLink("field:" + f.path)}`;
detail.policy = p => `${badge("policy")}<h2>${esc(p.title || p.key)}</h2><p class="muted">${esc(p.key)}${p.sample ? " · sample text" : ""}</p>
  ${p.text ? `<div class="quote">${esc(p.text)}</div>` : '<p class="muted">No text stored.</p>'}
  <dl class="kv">${p.owner ? `<dt>Owner</dt><dd>${esc(p.owner)}</dd>` : ""}${p.version ? `<dt>Version</dt><dd>${esc(p.version)}</dd>` : ""}${p.effective ? `<dt>Effective</dt><dd>${esc(p.effective)}</dd>` : ""}
  <dt>Rules derived</dt><dd>${refs("rule", p.rules)}</dd></dl>${graphLink("policy:" + p.key)}`;
detail.outcome = o => `${badge("outcome")}<h2 class="mono">${esc(o.token)}</h2><p>${esc(o.meaning || "")}</p>
  <dl class="kv"><dt>Classified by</dt><dd>${o.concept ? ref("concept", o.concept, cLabel(o.concept)) : '<span class="muted">unclassified</span>'}</dd>
  <dt>Explained by</dt><dd>${o.rules.length ? refs("rule", o.rules) : '<span class="muted">no rule: reported as a gap</span>'}</dd></dl>${graphLink("outcome:" + o.token)}`;
detail.ruleset = r => `${badge("ruleset")}<h2>${esc(r.id)}</h2><p>${esc(r.reason || "")}</p>
  <dl class="kv"><dt>Rule domain</dt><dd class="mono">${esc(r.domain)}</dd><dt>Owner</dt><dd>${esc(r.owner)}</dd><dt>Status</dt><dd>${esc(r.status)}</dd>
  <dt>In force</dt><dd>${esc(r.from)} → ${esc(r.to || "open")}</dd><dt>Replaces</dt><dd>${r.previous ? ref("ruleset", r.previous) : '<span class="muted">first release</span>'}</dd>
  <dt>Replaced by</dt><dd>${refs("ruleset", D.rulesets.filter(x => x.previous === r.id).map(x => x.id))}</dd>
  <dt>Rule versions</dt><dd>${r.rules.map(k => ref("rule", k.split("@")[0], k)).join(", ")}</dd></dl>${graphLink("ruleset:" + r.id)}`;
detail.class = c => `${badge("class")}<h2>${esc(c.name)}</h2><p>${esc(c.description)}</p>
  <dl class="kv"><dt>Outgoing</dt><dd>${D.ontology.relations.filter(r => r.domain === c.name).map(r => `${ref("relation", r.name)} → ${ref("class", r.range)}`).join("<br>") || '<span class="muted">none</span>'}</dd>
  <dt>Incoming</dt><dd>${D.ontology.relations.filter(r => r.range === c.name).map(r => `${ref("class", r.domain)} ${ref("relation", r.name)}`).join("<br>") || '<span class="muted">none</span>'}</dd></dl>`;
detail.relation = r => `${badge("relation")}<h2>${esc(r.name)}</h2><p>${ref("class", r.domain)} → ${ref("class", r.range)}</p>${r.aligns ? `<p class="muted">Aligns with ${esc(r.aligns)}</p>` : ""}
  <p>${D.graph.edges.filter(e => e[1] === r.name).length} edges in the graph.</p>`;
function open(key, version){
  const i = key.indexOf(":"), kind = key.slice(0, i), id = key.slice(i + 1);
  const item = {concept:C, term:T, rule:R, field:F, policy:P, outcome:O, ruleset:RS, class:CL, relation:REL}[kind]?.[id];
  if (!item) return;
  $("#detail").innerHTML = `<button class="close" id="dclose" aria-label="Close">Close</button>` + detail[kind](item, version);
  $("#wrap").classList.add("split"); $("#detail").scrollTop = 0;
  $("#dclose").onclick = () => $("#wrap").classList.remove("split");
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-graph]"); if (g) { e.preventDefault(); const id = g.dataset.graph; location.hash = "#/graph"; setTimeout(() => window.__graphSelect && window.__graphSelect(id), 30); return; }
  const v = e.target.closest("[data-ver]"); if (v) { const [rid, ver] = v.dataset.ver.split("|"); open("rule:" + rid, +ver); return; }
  const a = e.target.closest("[data-ref]"); if (a) { e.preventDefault(); open(a.dataset.ref); }
});

// ------------------------------------------------------------ search
const INDEX = [
  ...D.terms.map(t => ({k: "term", id: t.id, l: t.label, s: [t.label, ...t.alt, t.definition].join(" ")})),
  ...D.concepts.map(c => ({k: "concept", id: c.id, l: c.label, s: [c.label, c.id, ...c.alt, c.definition].join(" ")})),
  ...D.rules.map(r => ({k: "rule", id: r.id, l: `${r.id}: ${latest(r).intent}`, s: [r.id, r.domain, ...r.versions.map(v => v.intent + " " + v.condition)].join(" ")})),
  ...D.fields.map(f => ({k: "field", id: f.path, l: f.path, s: [f.path, f.description, f.pointer || ""].join(" ")})),
  ...D.policies.map(p => ({k: "policy", id: p.key, l: p.title || p.key, s: [p.key, p.title || "", p.text || ""].join(" ")})),
  ...D.outcomes.map(o => ({k: "outcome", id: o.token, l: `${o.token} ${o.meaning || ""}`, s: [o.token, o.meaning || ""].join(" ")})),
  ...D.rulesets.map(r => ({k: "ruleset", id: r.id, l: r.id, s: [r.id, r.domain, r.reason || ""].join(" ")})),
];
let hits = [], on = 0;
$("#q").addEventListener("input", () => {
  const q = $("#q").value.trim().toLowerCase(), box = $("#results");
  if (!q) { box.style.display = "none"; return; }
  const words = q.split(/\s+/);
  hits = INDEX.map(x => { const s = x.s.toLowerCase(), l = x.l.toLowerCase(); if (!words.every(w => s.includes(w))) return null;
      return [x, (l.startsWith(q) ? 3 : 0) + (l.includes(q) ? 2 : 0) + (x.k === "term" ? .5 : 0)]; })
    .filter(Boolean).sort((a, b) => b[1] - a[1]).slice(0, 14).map(x => x[0]);
  on = 0;
  box.innerHTML = hits.map((h, i) => `<div data-i="${i}" class="${i === 0 ? "on" : ""}">${badge(h.k)}<span>${esc(h.l)}</span></div>`).join("") || '<div class="muted">No match</div>';
  box.style.display = "block";
});
$("#q").addEventListener("keydown", e => {
  const box = $("#results"); if (!hits.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); on = (on + (e.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length;
    [...box.children].forEach((c, i) => c.classList.toggle("on", i === on)); }
  if (e.key === "Enter") { open(hits[on].k + ":" + hits[on].id); box.style.display = "none"; }
  if (e.key === "Escape") box.style.display = "none";
});
$("#results").addEventListener("click", e => { const d = e.target.closest("[data-i]"); if (!d) return; const h = hits[+d.dataset.i]; open(h.k + ":" + h.id); $("#results").style.display = "none"; });
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("#results").style.display = "none"; });

// ------------------------------------------------------------ routing
function route(){
  const tab = (location.hash.match(/^#\/(\w+)/) || [, "overview"])[1];
  const page = pages[tab] || pages.overview;
  $("#main").innerHTML = page();
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === (pages[tab] ? tab : "overview")));
  if (page.after) page.after();
}
window.addEventListener("hashchange", route);
route();
})();
</script>
