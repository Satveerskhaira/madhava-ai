# Sample benefit setup for one plan, in the shape the benefit setup API returns.
# Versions are effective-dated; later versions list only what changed and are
# deep-merged over the previous version by the fixture API.
# `synthetic_padding` adds filler fields so the payload has roughly the size
# of the real API (~12k leaf fields), to prove slices never load all of it.

planId: PLN-COMM-4T
name: Commercial 4-tier plan (sample)
synthetic_padding: 12000

versions:
  - version: "2026.01"
    effectiveFrom: "2026-01-01"
    setup:
      formulary:
        drugList:
          SAMPLE-GLP1:       {onFormulary: true, tier: 4, paRequired: true, specialty: false}
          SAMPLE-ATORVA:     {onFormulary: true, tier: 1, paRequired: false, specialty: false}
          SAMPLE-HAIR:       {onFormulary: true, tier: 3, excluded: true, paRequired: false, specialty: false}
          SAMPLE-INHALER:    {onFormulary: true, tier: 2, paRequired: false, specialty: false}
          SAMPLE-NPBRAND:    {onFormulary: true, tier: 3, paRequired: false, specialty: false}
          SAMPLE-BIOLOGIC:   {onFormulary: true, tier: 4, paRequired: false, specialty: true, qlQuantity: 12.0}
          SAMPLE-BIOLOGIC2:  {onFormulary: true, tier: 4, paRequired: false, specialty: true}
          SAMPLE-DPP4:       {onFormulary: true, tier: 3, paRequired: false, specialty: false, stepPrereqs: [SAMPLE-METFORMIN]}
          SAMPLE-METFORMIN:  {onFormulary: true, tier: 1, paRequired: false, specialty: false}
          SAMPLE-FLUCONAZOLE: {onFormulary: true, tier: 1, paRequired: false, specialty: false, interactsWith: [SAMPLE-WARFARIN]}
          SAMPLE-WARFARIN:   {onFormulary: true, tier: 1, paRequired: false, specialty: false}
      um:
        priorAuth: {requiredTiers: [4], transitionFillDays: 30}
      limits:
        maxDaysSupply: {retail: 90, mail: 90, specialty: 30}
      dur:
        refillTooSoon: {thresholdPct: 80.0}
        interactions: {reject: true}
      network:
        specialty: {retailMaxDaysSupply: 30}
      cob:
        primaryFirst: true
      costShare:
        deductible: {amount: 250.0, appliesToTiers: [3]}
        tiers:
          "1": {retail: {copay: 10.0}, mail: {copay: 20.0}}
          "2": {retail: {copay: 30.0}, mail: {copay: 60.0}}
          "3": {retail: {copay: 60.0}, mail: {copay: 120.0}}
          "4":
            retail: {coinsurancePct: 25.0, maxPerFill: 150.0}
            mail: {coinsurancePct: 25.0, maxPerFill: 150.0}
            specialty: {coinsurancePct: 25.0, maxPerFill: 150.0}

  - version: "2026.07"
    effectiveFrom: "2026-07-01"
    changes:
      costShare:
        tiers:
          "2": {retail: {copay: 35.0}, mail: {copay: 70.0}}
