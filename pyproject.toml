[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "madhava"
version = "0.1.0"
description = "Multi-agent pharmacy claim explanation: planner and domain agents over a rules/policy graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-adk[a2a]>=2.12",
  "a2a-sdk>=1.2",
  "mcp>=2.3",
  "cel-python>=0.5",
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Any model behind LiteLLM (for example Claude through an enterprise gateway).
litellm = ["google-adk[extensions]>=2.12"]

[project.scripts]
madhava = "madhava.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
