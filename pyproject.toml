[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "madhava"
version = "0.3.0"
description = "Core agent that explains pharmacy claim outcomes using the pharmacy domain agents"
readme = "README.md"
requires-python = ">=3.11"
# Sources are pinned in requirements-dev.txt: kernel (./kernel) and base (./base) from this repo,
# domain agent packages from their own repos. Domain packages are discovered at run time.
dependencies = [
  "rulegraph[adk,mcp]>=0.2",
  "pharmacy-base>=0.1",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
madhava = "madhava.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
madhava = ["procedures/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
