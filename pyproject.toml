[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "madhava"
version = "0.2.0"
description = "Core agent that explains pharmacy claim outcomes using the pharmacy domain agents"
readme = "README.md"
requires-python = ">=3.11"
# Sources for these are pinned in requirements-dev.txt (kernel in ./kernel, domain agents from their repo).
dependencies = [
  "rulegraph[adk,mcp]>=0.1",
  "pharmacy-agents>=0.1",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
madhava = "madhava.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
madhava = ["procedures/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
