# Domain agent procedures (procedural memory).
#
# Every domain agent runs the same investigation playbook, step by step. The
# steps are fixed in code order here, never chosen by a model, so the agent
# cannot skip evaluation or overrides. Agents may add notes and mode settings.
#
# Steps:
#   recall_rules          graph search for candidate rules inside the agent's
#                         taxonomy branch, filtered to the rule sets in force
#   resolve_inputs        fetch only the claim and plan fields those rules read
#   evaluate              run each rule's CEL condition, in rule order
#   apply_overrides       a fired rule whose override also fires is overridden
#   widen_if_unexplained  if nothing explains the task's outcomes, search once
#                         more by text and broader concepts (bounded loop)
#   phrase                fill the rule templates with evidence values

default:
  steps:
    - {do: recall_rules, k: 12}
    - {do: resolve_inputs}
    - {do: evaluate}
    - {do: apply_overrides}
    - {do: widen_if_unexplained, max: 1}
    - {do: phrase}
  modes:
    explain: {outcome_types: [reject, pricing, info, override]}
    what_if: {outcome_types: [pricing, override], ignore_actuals: true}

agents:
  eligibility:
    notes: Eligibility is checked first in adjudication; a fired eligibility rule is usually the primary reason.
  coverage:
    notes: Always report tier placement, since cost share and some PA rules depend on it.
  utilization_management:
    notes: Check overrides such as transition fills before reporting a prior authorization reject.
  clinical_dur:
    notes: Refill too soon uses claims history; report the days elapsed and the threshold.
  network:
    notes: Specialty drugs can be limited by channel even when quantity limits pass.
  cob:
    notes: Report the other coverage code submitted and what is on file.
  cost_share:
    notes: Deductible rules override copay and coinsurance while the deductible is unmet.
