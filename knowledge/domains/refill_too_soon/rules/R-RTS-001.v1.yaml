id: R-RTS-001
version: 1
status: approved
domain: refill_too_soon
concept: dur.refill_too_soon
intent: Reject a refill when less than the threshold share of the previous days supply has elapsed
outcome: {type: reject, code: "79"}
claim_inputs: [claim.history.daysSinceLastFill, claim.history.lastDaysSupply]
plan_inputs: [plan.dur.refillTooSoon.thresholdPct]
condition: >
  has(claim.history.daysSinceLastFill)
  && double(claim.history.daysSinceLastFill) <
     double(claim.history.lastDaysSupply) * double(plan.dur.refillTooSoon.thresholdPct) / 100.0
order: 10
template: >
  Only {{claim.history.daysSinceLastFill}} days passed since the last
  {{claim.history.lastDaysSupply}}-day fill; the plan requires
  {{plan.dur.refillTooSoon.thresholdPct}}% of the supply to be used first.
source_refs: [{doc: Clinical Edits Guide v2, section: "1.1 Refill too soon"}]
confidence: high
sme_owner: clinical-sme-team
