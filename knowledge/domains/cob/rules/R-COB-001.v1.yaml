id: R-COB-001
version: 1
status: approved
domain: cob
concept: cob.other_coverage
intent: Reject when other primary coverage is on file but the claim was not billed to it first
outcome: {type: reject, code: "41"}
claim_inputs: [claim.member.otherCoverageOnFile, claim.otherCoverageCode]
plan_inputs: [plan.cob.primaryFirst]
condition: >
  plan.cob.primaryFirst && claim.member.otherCoverageOnFile
  && claim.otherCoverageCode in ['0', '1']
order: 10
template: >
  The member has other primary coverage on file, but the claim was submitted with other
  coverage code {{claim.otherCoverageCode}}; it must be billed to the primary payer first.
source_refs: [{doc: COB Processing Guide v2, section: "1.2 Primary payer first"}]
confidence: high
sme_owner: cob-sme-team
