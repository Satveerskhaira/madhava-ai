id: R-ACC-001
version: 1
status: approved
domain: accumulators
concept: cost_share.deductible
intent: Member pays toward the deductible before copay applies on deductible tiers
outcome:
  type: pricing
  component: deductible
  amount: >
    double(claim.pricing.submittedCost) < double(claim.accumulators.deductibleRemaining)
    ? double(claim.pricing.submittedCost) : double(claim.accumulators.deductibleRemaining)
  actual: claim.pricing.deductibleApplied
claim_inputs: [claim.pricing.submittedCost, claim.accumulators.deductibleRemaining, claim.pricing.deductibleApplied]
plan_inputs: [plan.formulary.drug.tier, plan.costShare.deductible.appliesToTiers]
condition: >
  has(plan.formulary.drug.tier) && plan.formulary.drug.tier in plan.costShare.deductible.appliesToTiers
  && double(claim.accumulators.deductibleRemaining) > 0.0
order: 10
template: >
  Tier {{plan.formulary.drug.tier}} is subject to the deductible, and
  ${{claim.accumulators.deductibleRemaining|money}} was still unmet, so the member paid ${{amount|money}}
  toward the deductible instead of a copay.
source_refs: [{doc: Benefit Summary 2026, section: "Deductible"}]
confidence: high
sme_owner: benefits-sme-team
