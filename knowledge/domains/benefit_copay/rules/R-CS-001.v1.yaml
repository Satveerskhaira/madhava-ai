id: R-CS-001
version: 1
status: approved
domain: benefit_copay
concept: cost_share.copay
intent: Member pays the flat copay set for the drug's tier and channel
outcome:
  type: pricing
  component: copay
  amount: "double(plan.costShare.copay)"
  actual: claim.pricing.copay
claim_inputs: [claim.pharmacy.channel, claim.pricing.copay]
plan_inputs: [plan.formulary.drug.tier, plan.costShare.copay]
condition: "has(plan.costShare.copay)"
order: 20
overridden_by: [R-ACC-001]
template: >
  Tier {{plan.formulary.drug.tier}} drugs have a ${{amount|money}} copay at {{claim.pharmacy.channel}}
  on this plan.
source_refs: [{doc: Benefit Summary 2026, section: "Pharmacy cost share"}]
confidence: high
sme_owner: benefits-sme-team
