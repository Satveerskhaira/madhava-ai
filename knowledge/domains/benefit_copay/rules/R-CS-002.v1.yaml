id: R-CS-002
version: 1
status: approved
domain: benefit_copay
concept: cost_share.coinsurance
intent: Member pays coinsurance for the drug's tier and channel, capped per fill
outcome:
  type: pricing
  component: coinsurance
  amount: >
    double(claim.pricing.submittedCost) * double(plan.costShare.coinsurancePct) / 100.0
      < double(plan.costShare.maxPerFill)
    ? double(claim.pricing.submittedCost) * double(plan.costShare.coinsurancePct) / 100.0
    : double(plan.costShare.maxPerFill)
  actual: claim.pricing.coinsurance
claim_inputs: [claim.pharmacy.channel, claim.pricing.submittedCost, claim.pricing.coinsurance]
plan_inputs: [plan.formulary.drug.tier, plan.costShare.coinsurancePct, plan.costShare.maxPerFill]
condition: "has(plan.costShare.coinsurancePct)"
order: 21
overridden_by: [R-ACC-001]
template: >
  Tier {{plan.formulary.drug.tier}} has {{plan.costShare.coinsurancePct}}% coinsurance at
  {{claim.pharmacy.channel}}, capped at ${{plan.costShare.maxPerFill|money}} per fill, so the member
  pays ${{amount|money}}.
source_refs: [{doc: Benefit Summary 2026, section: "Pharmacy cost share"}]
confidence: high
sme_owner: benefits-sme-team
