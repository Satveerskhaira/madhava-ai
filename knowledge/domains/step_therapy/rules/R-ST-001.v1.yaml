id: R-ST-001
version: 1
status: approved
domain: step_therapy
concept: um.step_therapy
intent: Reject when no required first-line drug was filled in the lookback window
outcome: {type: reject, code: "608"}
claim_inputs: [claim.drug.name, claim.history.stepDrugsFilled]
plan_inputs: [plan.formulary.drug.stepPrereqs]
condition: >
  has(plan.formulary.drug.stepPrereqs) && size(plan.formulary.drug.stepPrereqs) > 0
  && !plan.formulary.drug.stepPrereqs.exists(d, d in claim.history.stepDrugsFilled)
order: 30
template: >
  {{claim.drug.name}} requires trying {{plan.formulary.drug.stepPrereqs|list}} first, and none
  was filled in the lookback window.
source_refs: [{doc: Plan Setup Guide v7, section: "4.3 Step therapy"}]
confidence: high
sme_owner: um-sme-team
