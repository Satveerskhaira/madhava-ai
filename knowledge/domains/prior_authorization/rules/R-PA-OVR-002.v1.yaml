id: R-PA-OVR-002
version: 1
status: approved
domain: prior_authorization
concept: um.prior_authorization
intent: Waive prior authorization during a new member's transition window
outcome: {type: override}
claim_inputs: [claim.member.daysSinceEnrollment]
plan_inputs: [plan.um.priorAuth.transitionFillDays]
condition: "claim.member.daysSinceEnrollment <= plan.um.priorAuth.transitionFillDays"
order: 10
template: >
  The member enrolled {{claim.member.daysSinceEnrollment}} days ago, inside the
  {{plan.um.priorAuth.transitionFillDays}}-day transition window, so prior authorization is waived.
source_refs: [{doc: Plan Setup Guide v7, section: "4.5 Transition fills"}]
confidence: high
sme_owner: um-sme-team
