# Field catalog: the closed vocabulary rules may read.
#
# Every rule input must be a path listed here (checked in CI). Each field sits
# on an ontology class (`entity`) and a taxonomy concept (`concept`), which is
# how the policy graph links fields to rules and to the questions they answer.
#
# claim.* fields come from the claims API (and claims history / accumulator
#   lookups made by the claim tool). `ncpdp` gives the Telecommunication D.0
#   field where one exists; verify against your payer sheet.
# plan.* fields come from the benefit setup API, resolved by date of service.
#   `pointer` is a JSON Pointer into the benefit setup payload. `{name}`
#   placeholders are filled from `params`, which may name a claim field or
#   another plan field (resolved first).

fields:
  # ------------------------------------------------------------------ claim
  - {path: claim.id, source: claim, entity: Claim, type: string, concept: eligibility,
     description: Claim identifier}
  - {path: claim.dos, source: claim, entity: Claim, type: date, ncpdp: 401-D1, concept: eligibility,
     description: Date of service (date the prescription was filled)}
  - {path: claim.adjudicatedAt, source: claim, entity: ClaimResponse, type: date,
     concept: eligibility, description: Date the claim was adjudicated}
  - {path: claim.status, source: claim, entity: ClaimResponse, type: string, ncpdp: 112-AN,
     concept: eligibility, description: Transaction response status (paid or rejected)}
  - {path: claim.rejectCodes, source: claim, entity: ClaimResponse, type: list, ncpdp: 511-FB,
     concept: eligibility, description: Reject codes returned on the response}
  - {path: claim.planId, source: claim, entity: Claim, type: string, concept: eligibility,
     description: Plan the claim adjudicated under}

  - {path: claim.member.coverageStart, source: claim, entity: Member, type: date,
     concept: eligibility.member_coverage, description: First date of the member's pharmacy coverage}
  - {path: claim.member.coverageEnd, source: claim, entity: Member, type: date,
     concept: eligibility.member_coverage, description: "Last date of coverage, absent while coverage is open"}
  - {path: claim.member.coverageEndReason, source: claim, entity: Member, type: string,
     concept: eligibility.member_coverage, description: Why coverage ended (terminated or expired),
     decoded_values: {terminated: Coverage terminated, expired: Coverage reached its end date}}
  - {path: claim.member.daysSinceEnrollment, source: claim, entity: Member, type: integer,
     concept: um.prior_authorization, description: Days between enrollment and the date of service}
  - {path: claim.member.otherCoverageOnFile, source: claim, entity: Member, type: boolean,
     concept: cob.other_coverage, description: Other primary coverage is on file for the member}

  - {path: claim.drug.ndc, source: claim, entity: Drug, type: string, ncpdp: 407-D7,
     concept: coverage, description: Product/Service ID (NDC) submitted}
  - {path: claim.drug.gpi, source: claim, entity: Drug, type: string, concept: coverage,
     description: Drug classification key used to look up formulary entries}
  - {path: claim.drug.name, source: claim, entity: Drug, type: string, concept: coverage,
     description: Drug name for explanations}

  - {path: claim.pharmacy.channel, source: claim, entity: Pharmacy, type: string,
     concept: network.specialty_channel, description: Dispensing channel,
     decoded_values: {retail: Retail pharmacy, mail: Mail order, specialty: Specialty pharmacy}}

  - {path: claim.quantity, source: claim, entity: Claim, type: number, ncpdp: 442-E7,
     concept: um.quantity_limits, description: Quantity dispensed}
  - {path: claim.daysSupply, source: claim, entity: Claim, type: integer, ncpdp: 405-D5,
     concept: um.quantity_limits, description: Days supply dispensed}
  - {path: claim.fillNumber, source: claim, entity: Claim, type: integer, ncpdp: 403-D3,
     concept: dur.refill_too_soon, description: Fill number (0 for a new prescription)}
  - {path: claim.priorAuth.onFile, source: claim, entity: Claim, type: boolean,
     concept: um.prior_authorization, description: An approved prior authorization covers this fill}
  - {path: claim.otherCoverageCode, source: claim, entity: Claim, type: string, ncpdp: 308-C8,
     concept: cob.other_coverage, description: Other coverage code submitted on the claim}

  - {path: claim.history.daysSinceLastFill, source: claim, entity: ClaimHistory, type: integer,
     concept: dur.refill_too_soon, description: Days since the previous fill of the same drug}
  - {path: claim.history.lastDaysSupply, source: claim, entity: ClaimHistory, type: integer,
     concept: dur.refill_too_soon, description: Days supply of the previous fill}
  - {path: claim.history.stepDrugsFilled, source: claim, entity: ClaimHistory, type: list,
     concept: um.step_therapy, description: Drugs filled in the step therapy lookback window}
  - {path: claim.history.activeDrugs, source: claim, entity: ClaimHistory, type: list,
     concept: dur.drug_interaction, description: Drugs with active supply on the date of service}

  - {path: claim.pricing.submittedCost, source: claim, entity: ClaimResponse, type: number, ncpdp: 430-DU,
     concept: cost_share, description: Gross amount due submitted by the pharmacy}
  - {path: claim.pricing.patientPay, source: claim, entity: ClaimResponse, type: number, ncpdp: 505-F5,
     concept: cost_share, description: Patient pay amount}
  - {path: claim.pricing.copay, source: claim, entity: ClaimResponse, type: number, ncpdp: 518-FI,
     concept: cost_share.copay, description: Amount of copay}
  - {path: claim.pricing.coinsurance, source: claim, entity: ClaimResponse, type: number, ncpdp: 572-4U,
     concept: cost_share.coinsurance, description: Amount of coinsurance}
  - {path: claim.pricing.deductibleApplied, source: claim, entity: ClaimResponse, type: number, ncpdp: 517-FH,
     concept: cost_share.deductible, description: Amount applied to periodic deductible}
  - {path: claim.accumulators.deductibleRemaining, source: claim, entity: Accumulator, type: number,
     concept: cost_share.deductible, description: Deductible remaining before this fill}

  # ------------------------------------------------------------------- plan
  - {path: plan.formulary.drug.onFormulary, source: plan, entity: FormularyEntry, type: boolean,
     pointer: "/formulary/drugList/{gpi}/onFormulary", params: {gpi: claim.drug.gpi},
     concept: coverage.formulary_status, description: The drug is on the plan formulary}
  - {path: plan.formulary.drug.excluded, source: plan, entity: FormularyEntry, type: boolean,
     pointer: "/formulary/drugList/{gpi}/excluded", params: {gpi: claim.drug.gpi},
     concept: coverage.exclusion, description: The drug is excluded from the benefit}
  - {path: plan.formulary.drug.tier, source: plan, entity: FormularyEntry, type: integer,
     pointer: "/formulary/drugList/{gpi}/tier", params: {gpi: claim.drug.gpi},
     concept: coverage.tier, description: Formulary tier of the drug,
     decoded_values: {1: Generic, 2: Preferred brand, 3: Non-preferred brand, 4: Specialty}}
  - {path: plan.formulary.drug.paRequired, source: plan, entity: FormularyEntry, type: boolean,
     pointer: "/formulary/drugList/{gpi}/paRequired", params: {gpi: claim.drug.gpi},
     concept: um.prior_authorization, description: The drug is individually flagged as needing prior authorization}
  - {path: plan.formulary.drug.specialty, source: plan, entity: FormularyEntry, type: boolean,
     pointer: "/formulary/drugList/{gpi}/specialty", params: {gpi: claim.drug.gpi},
     concept: network.specialty_channel, description: The drug is a specialty drug}
  - {path: plan.formulary.drug.qlQuantity, source: plan, entity: FormularyEntry, type: number,
     pointer: "/formulary/drugList/{gpi}/qlQuantity", params: {gpi: claim.drug.gpi},
     concept: um.quantity_limits, description: Maximum quantity per fill for the drug}
  - {path: plan.formulary.drug.stepPrereqs, source: plan, entity: FormularyEntry, type: list,
     pointer: "/formulary/drugList/{gpi}/stepPrereqs", params: {gpi: claim.drug.gpi},
     concept: um.step_therapy, description: Drugs that must be tried first}
  - {path: plan.formulary.drug.interactsWith, source: plan, entity: FormularyEntry, type: list,
     pointer: "/formulary/drugList/{gpi}/interactsWith", params: {gpi: claim.drug.gpi},
     concept: dur.drug_interaction, description: Drugs with a severe interaction with this drug}

  - {path: plan.um.priorAuth.requiredTiers, source: plan, entity: BenefitSetting, type: list,
     pointer: /um/priorAuth/requiredTiers, concept: um.prior_authorization,
     description: Tiers where every drug needs prior authorization}
  - {path: plan.um.priorAuth.transitionFillDays, source: plan, entity: BenefitSetting, type: integer,
     pointer: /um/priorAuth/transitionFillDays, concept: um.prior_authorization,
     description: New-member transition window in which prior authorization is waived}
  - {path: plan.limits.maxDaysSupply, source: plan, entity: BenefitSetting, type: integer,
     pointer: "/limits/maxDaysSupply/{channel}", params: {channel: claim.pharmacy.channel},
     concept: um.quantity_limits, description: Maximum days supply per fill for the channel}
  - {path: plan.dur.refillTooSoon.thresholdPct, source: plan, entity: BenefitSetting, type: number,
     pointer: /dur/refillTooSoon/thresholdPct, concept: dur.refill_too_soon,
     description: Percent of the previous days supply that must be used before a refill}
  - {path: plan.dur.interactions.reject, source: plan, entity: BenefitSetting, type: boolean,
     pointer: /dur/interactions/reject, concept: dur.drug_interaction,
     description: Severe drug interactions reject rather than warn}
  - {path: plan.network.specialty.retailMaxDaysSupply, source: plan, entity: BenefitSetting, type: integer,
     pointer: /network/specialty/retailMaxDaysSupply, concept: network.specialty_channel,
     description: Maximum days supply when a specialty drug is filled at retail}
  - {path: plan.cob.primaryFirst, source: plan, entity: BenefitSetting, type: boolean,
     pointer: /cob/primaryFirst, concept: cob.other_coverage,
     description: Claims must go to the primary payer first when other coverage is on file}
  - {path: plan.costShare.copay, source: plan, entity: BenefitSetting, type: number,
     pointer: "/costShare/tiers/{tier}/{channel}/copay",
     params: {tier: plan.formulary.drug.tier, channel: claim.pharmacy.channel},
     concept: cost_share.copay, description: Copay for the drug's tier and channel}
  - {path: plan.costShare.coinsurancePct, source: plan, entity: BenefitSetting, type: number,
     pointer: "/costShare/tiers/{tier}/{channel}/coinsurancePct",
     params: {tier: plan.formulary.drug.tier, channel: claim.pharmacy.channel},
     concept: cost_share.coinsurance, description: Coinsurance percent for the drug's tier and channel}
  - {path: plan.costShare.maxPerFill, source: plan, entity: BenefitSetting, type: number,
     pointer: "/costShare/tiers/{tier}/{channel}/maxPerFill",
     params: {tier: plan.formulary.drug.tier, channel: claim.pharmacy.channel},
     concept: cost_share.coinsurance, description: Maximum member cost per fill for the tier and channel}
  - {path: plan.costShare.deductible.appliesToTiers, source: plan, entity: BenefitSetting, type: list,
     pointer: /costShare/deductible/appliesToTiers, concept: cost_share.deductible,
     description: Tiers where the deductible applies before copay or coinsurance}
