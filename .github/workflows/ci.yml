name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Validate knowledge (rules, catalog, taxonomy, releases)
        run: madhava validate
      - name: Replay golden claims
        run: madhava --today 2026-10-14 eval
      - name: Tests
        run: pytest -q
